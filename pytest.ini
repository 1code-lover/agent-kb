[pytest]
testpaths = tests
asyncio_default_fixture_loop_scope = function
markers =
    slow: 运行耗时较长的集成/真实模型测试
filterwarnings =
    ignore:.*validate_default.*Field.*:pydantic.warnings.UnsupportedFieldAttributeWarning:pydantic\._internal\._generate_schema
    ignore:pkg_resources is deprecated as an API\..*:UserWarning:jieba\._compat
    ignore:.*declare_namespace.*google.*:DeprecationWarning:pkg_resources
